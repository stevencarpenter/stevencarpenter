<svg width="456" height="14" viewBox="0 0 456 14" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Each cell is one week. A stronger green means more commits. An orange dot marks a release.">
<text x="0" y="11" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#727a84">Weekly commits:</text>
<rect x="104" y="0" width="7" height="13" rx="2" fill="#8b949e" fill-opacity="0.25"/>
<text x="115" y="11" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#727a84">0</text>
<rect x="136" y="0" width="7" height="13" rx="2" fill="#2da44e" fill-opacity="0.35"/>
<text x="147" y="11" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#727a84">1 to 2</text>
<rect x="192" y="0" width="7" height="13" rx="2" fill="#2da44e" fill-opacity="0.55"/>
<text x="203" y="11" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#727a84">3 to 6</text>
<rect x="248" y="0" width="7" height="13" rx="2" fill="#2da44e" fill-opacity="0.8"/>
<text x="259" y="11" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#727a84">7 to 14</text>
<rect x="312" y="0" width="7" height="13" rx="2" fill="#2da44e" fill-opacity="1"/>
<text x="323" y="11" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#727a84">15 or more</text>
<circle cx="399.5" cy="7" r="3.5" fill="#e16f24"/>
<text x="407" y="11" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" fill="#727a84">release</text>
</svg>
